# This workflow publishes a GitHub Release when a version tag (for example v0.2.0)
# is pushed. It tests the tagged commit, builds the same Linux and macOS binaries as
# the Build binaries workflow, and attaches them to the release with a combined
# SHA256SUMS file. Tags with a hyphen (for example v0.2.0-rc.1) become prereleases.

name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history so the tagged commit can be checked against origin/main.
        fetch-depth: 0

    - name: Check tag is semver
      env:
        TAG: ${{ github.ref_name }}
      run: |
        # vMAJOR.MINOR.PATCH with an optional -prerelease (no leading zeros, no +build).
        id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        semver="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${id}(\.${id})*)?$"
        if [[ ! "${TAG}" =~ ${semver} ]]; then
          echo "::error::Tag '${TAG}' is not a semver version tag like v1.2.3 or v1.2.3-rc.1"
          exit 1
        fi

    - name: Check tag is on main
      env:
        TAG: ${{ github.ref_name }}
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "::error::Tag '${TAG}' points to $(git rev-parse HEAD), which is not on main. Releases must be tagged from main."
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Test
      run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: linux
          goarch: amd64
        - goos: linux
          goarch: arm64
        - goos: darwin
          goarch: amd64
        - goos: darwin
          goarch: arm64
    env:
      BINARY: metapkg_${{ matrix.goos }}_${{ matrix.goarch }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -trimpath -o "dist/${BINARY}" ./cmd/metapkg

    - name: Checksum
      working-directory: dist
      run: sha256sum "${BINARY}" > "${BINARY}.sha256"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.BINARY }}
        path: |
          dist/${{ env.BINARY }}
          dist/${{ env.BINARY }}.sha256
        if-no-files-found: error
        # Artifacts are immutable; replace this run's copy if the job is re-run.
        overwrite: true
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: metapkg_*
        # Put every artifact's files directly in dist/ instead of one subdirectory each.
        merge-multiple: true
        path: dist

    - name: Write SHA256SUMS
      working-directory: dist
      run: |
        sha256sum -c ./*.sha256
        find . -maxdepth 1 -type f -name 'metapkg_*' ! -name '*.sha256' -printf '%f\n' | sort > binaries.txt
        if [[ ! -s binaries.txt ]]; then
          echo "::error::No binaries were downloaded"
          exit 1
        fi
        xargs sha256sum < binaries.txt > SHA256SUMS
        cat SHA256SUMS

    - name: Create release
      working-directory: dist
      run: |
        mapfile -t files < binaries.txt
        files+=(SHA256SUMS)

        # The release is created as a draft, given all its files, and only then
        # published, so a failed run never leaves a published release with missing
        # files. On a re-run, a draft left by an earlier attempt is finished with
        # --clobber; a release that is already published is never changed.
        if is_draft=$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null); then
          if [[ "${is_draft}" != "true" ]]; then
            echo "::error::Release ${TAG} is already published. Delete it first to publish it again."
            exit 1
          fi
          echo "Finishing draft release ${TAG} left by an earlier attempt"
          gh release upload "${TAG}" "${files[@]}" --clobber
        else
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${TAG}" "${files[@]}" \
            --draft \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes \
            "${prerelease[@]}"
        fi

        gh release edit "${TAG}" --draft=false
